# buf.gen.yaml
version: v2
plugins:
  # Go message types
  # Go plugin versions are pinned: unpinned remote plugins resolve to the
  # latest release, which rewrites every generated file (and connect-go v2
  # changes the generated API).
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: internal/pb
    opt: paths=source_relative
  # Go Connect service stubs
  - remote: buf.build/connectrpc/go:v1.19.1
    out: internal/pb
    opt: paths=source_relative
  # TypeScript message types
  - remote: buf.build/bufbuild/es:v2.11.0
    out: web/src/pb
    include_imports: true
  # TanStack Query hooks
  - remote: buf.build/connectrpc/query-es:v2.2.0
    out: web/src/pb
inputs:
  - directory: pb
