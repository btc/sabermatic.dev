# buf.gen.yaml
version: v2
plugins:
  # Go message types
  - remote: buf.build/protocolbuffers/go
    out: internal/pb
    opt: paths=source_relative
  # Go Connect service stubs
  - remote: buf.build/connectrpc/go
    out: internal/pb
    opt: paths=source_relative
  # TypeScript message types
  - remote: buf.build/bufbuild/es:v2.11.0
    out: web/src/pb
  # TanStack Query hooks
  - remote: buf.build/connectrpc/query-es:v2.2.0
    out: web/src/pb
inputs:
  - directory: pb
