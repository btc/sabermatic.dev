name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check Go version consistency
        run: ./scripts/check-go-version.sh

      # --- Frontend ---

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Frontend lint
        run: npm run lint
        working-directory: web

      - name: Frontend tests
        run: npm run test
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web

      # --- Go ---

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25.x"

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          only-new-issues: true

      - name: Install tools
        # setup-go v6 exports GOTOOLCHAIN=local for later steps. sqlc v1.31.1
        # requires Go >= 1.26, so let this one step download that toolchain.
        env:
          GOTOOLCHAIN: auto
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

      - name: Sqlc diff
        run: sqlc diff

      - name: Test
        run: go test ./... -race -count=1 -timeout=300s
