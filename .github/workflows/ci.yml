name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Go version consistency
        run: ./scripts/check-go-version.sh

      # --- Frontend ---

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Frontend lint
        run: npm run lint
        working-directory: web

      - name: Frontend tests
        run: npm run test
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web

      # --- Go ---

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          only-new-issues: true

      - name: Install tools
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest

      - name: Sqlc diff
        run: sqlc diff

      - name: Test
        run: go test ./... -race -count=1 -timeout=300s
