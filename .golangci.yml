version: "2"

run:
  timeout: 5m

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - gocritic
    - misspell
    - revive
  settings:
    errcheck:
      check-blank: false
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: internal/backend/oauth.go
        linters: [errcheck]
        text: "tx.Rollback"
    paths:
      - internal/pb
      - ".*\\.sql\\.go$"
