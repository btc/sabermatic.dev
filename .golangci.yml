version: "2"

run:
  timeout: 5m

issues:
  new-from-rev: main

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - gocritic
    - misspell
    - revive
  settings:
    errcheck:
      check-blank: false
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    paths:
      - internal/pb
      - ".*\\.sql\\.go$"
